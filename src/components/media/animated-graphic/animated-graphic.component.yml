$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Animated graphic
description: A looping video with a play/pause control.
status: experimental
group: Content
libraryOverrides:
  js:
    animated-graphic.js:
      attributes:
        type: module
      preprocess: false
props:
  type: object
  required: [src]
  properties:
    src:
      type: string
      title: Video source
    theme:
      type: string
      title: Theme
