$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Section
description: Section
status: experimental
group: Content
libraryOverrides:
  js:
    section.js:
      attributes:
        type: module
      preprocess: false
props:
  type: object
  required: ["theme"]
  properties:
    background_images:
      type: array
      title: Background images
      items:
        $ref: "json-schema-definitions://canvas.module/image"
    background_image_interval:
      type: number
      title: Background image interval
      description: "The time (in seconds) between background images crossfading."
      examples: [5]
    theme:
      type: string
      title: Theme
      enum: ["neutral", "cool", "warm", "dark"]
      meta:enum:
        neutral: Neutral (white)
        cool: Cool (light blue)
        warm: Warm (pink)
        dark: Dark (navy)
      examples: ["neutral"]
    classes:
      type: string
      title: Classes
slots:
  content:
    title: Content
