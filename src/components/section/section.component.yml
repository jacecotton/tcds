$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Section
description: Section
status: experimental
group: Content
props:
  type: object
  required: ["theme"]
  properties:
    theme:
      type: string
      title: Theme
      enum: ["neutral", "cool", "warm", "dark"]
      meta:enum:
        neutral: Neutral (white)
        cool: Cool (light blue)
        warm: Warm (pink)
        dark: Dark (navy)
      examples: ["neutral"]
    classes:
      type: string
      title: Classes
slots:
  content:
    title: Content
