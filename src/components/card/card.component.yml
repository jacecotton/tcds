$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Card
description: Card
status: experimental
group: Content
props:
  type: object
  properties:
    image:
      type: object
      title: Image
      $ref: "json-schema-definitions://canvas.module/image"
    title:
      type: string
      title: Title
      examples: ["Card title"]
    link_href:
      type: string
      title: Link Destination
      format: uri-reference
      description: "The destination URL to use as the link's [href] attribute."
      examples: ["/"]
    link_text:
      type: string
      title: Link Text
      examples: ["Learn more"]
    description:
      type: string
      title: Description
      contentMediaType: text/html
      x-formatting-context: inline
      examples: ["Card description"]
    meta:
      type: string
      title: Meta text
    tag:
      type: string
      title: Content tag
    heading_level:
      type: string
      title: Heading level
      description: "The semantic heading level of the card title. Does not change visual appearance."
      enum: ["none", "h2", "h3", "h4", "h5", "h6"]
      meta:enum:
        "none": "None"
        h2: "Heading 2"
        h3: "Heading 3"
        h4: "Heading 4"
        h5: "Heading 5"
        h6: "Heading 6"
      examples: ["none"]
    orientation:
      type: string
      title: Orientation lock
      enum: ["none", "horizontal", "vertical"]
      meta:enum:
        none: "None"
        horizontal: "Horizontal"
        vertical: "Vertical"
      examples: ["none"]
    variant:
      type: string
      title: Variant
      enum: ["none", "lite", "featured"]
      meta:enum:
        "none": "None"
        lite: "Lite"
        featured: "Featured"
      examples: ["none"]
    size:
      type: string
      title: Size
      enum: ["none", "large"]
      meta:enum:
        "none": "Default"
        large: "Large"
      examples: ["none"]
    classes:
      type: string
      title: Custom classes
slots:
  figure:
    title: Figure
  footer:
    title: Footer
