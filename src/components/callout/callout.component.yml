$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Callout
description: Callout
status: experimental
group: Content
props:
  type: object
  properties:
    theme:
      type: string
      title: Theme
      enum:
        - neutral
        - cool
        - warm
        - dark
      enumNames:
        - 'Neutral (white)'
        - 'Cool (light blue)'
        - 'Warm (pink)'
        - 'Dark (navy)'
      default: cool
    classes:
      type: array
      title: Custom classes
      items:
        type: string
slots:
  content:
    title: Content
