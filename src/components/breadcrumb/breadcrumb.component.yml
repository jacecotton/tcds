$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Breadcrumb
description: Breadcrumb
status: experimental
group: Navigation
props:
  type: object
  required:
    - items
  properties:
    items:
      type: array
      title: Breadcrumb links
      items:
        type: object
        title: Link
        required:
          - text
        properties:
          text:
            type: string
            title: Link title
          url:
            type: string
            title: URL
            format: uri
    omit_last:
      type: boolean
      title: Omit Last
    backlink_only:
      type: boolean
      title: Backlink Only
