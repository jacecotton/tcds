$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Accordion
description: Accordion
status: experimental
group: Content
libraryOverrides:
  js:
    accordion.js:
      attributes:
        type: module
      preprocess: false
props:
  type: object
  properties:
    multiple:
      type: boolean
      title: Multiple
    heading_level:
      type: string
      title: Heading Level
      enum:
        - h2
        - h3
        - h4
        - h5
        - h6
      enumNames:
        - "H2"
        - "H3"
        - "H4"
        - "H5"
        - "H6"
      default: h3
  classes:
    type: array
    title: Custom classes
    items:
      type: string
slots:
  sections:
    title: Sections
