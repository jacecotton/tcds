$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Accordion
description: Accordion
status: experimental
group: Content
libraryOverrides:
  js:
    accordion.js:
      attributes:
        type: module
      preprocess: false
props:
  type: object
  required:
    - heading_level
  properties:
    multiple:
      type: boolean
      title: Multiple
      description: "Whether to allow users to open multiple accordion sections at a time."
    heading_level:
      type: string
      title: Heading level
      description: "The semantic heading level to use within the page outline (does not change visual appearance)."
      enum: ["h2", "h3", "h4", "h5", "h6"]
      meta:enum:
        h2: "Heading 2"
        h3: "Heading 3"
        h4: "Heading 4"
        h5: "Heading 5"
        h6: "Heading 6"
      default: h3
    classes:
      type: string
      title: Custom classes
slots:
  sections:
    title: Sections
