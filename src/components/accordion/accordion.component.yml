$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Accordion
description: Accordion
status: experimental
group: Content
libraryOverrides:
  js:
    accordion.js:
      attributes:
        type: module
      preprocess: false
props:
  type: object
  properties:
    multiple:
      type: boolean
      title: Multiple
      description: "Whether to allow users to open multiple accordion sections at a time."
    heading_level:
      type: string
      title: Heading Level
      description: "The semantic heading level to use within the page outline (does not change visual appearance)."
      default: h3
      enum:
        - h2
        - h3
        - h4
        - h5
        - h6
      "meta:enum":
        h2: "H2"
        h3: "H3"
        h4: "H4"
        h5: "H5"
        h6: "H6"
  classes:
    type: string
    title: Custom classes
slots:
  sections:
    title: Sections
