$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Accordion section
description: Accordion section
status: experimental
group: Content
libraryOverrides:
  js:
    accordion-section.js:
      attributes:
        type: module
      preprocess: false
props:
  type: object
  required:
    - heading_level
  properties:
    open:
      type: boolean
      title: Open
      default: false
    heading_level:
      type: string
      title: Heading level
      description: "The semantic heading level to use within the page outline (does not change visual appearance)."
      enum: ["h2", "h3", "h4", "h5", "h6"]
      meta:enum:
        h2: "Heading 2"
        h3: "Heading 3"
        h4: "Heading 4"
        h5: "Heading 5"
        h6: "Heading 6"
      default: h3
    title:
      type: string
      title: Title
slots:
  content:
    title: Content
