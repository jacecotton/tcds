$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Accordion section
description: Accordion section
status: experimental
group: Content
libraryOverrides:
  js:
    accordion-section.js:
      attributes:
        type: module
      preprocess: false
props:
  type: object
  required:
    - heading_level
  properties:
    open:
      type: boolean
      title: Open
      default: false
    heading_level:
      type: string
      title: Heading level
      description: "The semantic heading level to use within the page outline (does not change visual appearance)."
      default: h3
      enum:
        - h2
        - h3
        - h4
        - h5
        - h6
      "meta:enum":
        h2: "H2"
        h3: "H3"
        h4: "H4"
        h5: "H5"
        h6: "H6"
    title:
      type: string
      title: Title
slots:
  content:
    title: Content
