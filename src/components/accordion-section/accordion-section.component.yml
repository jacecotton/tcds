$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Accordion section
description: Accordion section
status: experimental
group: Content
libraryOverrides:
  js:
    accordion-section.js:
      attributes:
        type: module
props:
  type: object
  properties:
    open:
      type: boolean
      title: Open
      default: false
    heading_level:
      type: string
      title: Heading Level
      enum:
        - h2
        - h3
        - h4
        - h5
        - h6
      enumNames:
        - "H2"
        - "H3"
        - "H4"
        - "H5"
        - "H6"
      default: h3
    title:
      type: string
      title: Title
slots:
  content:
    title: Content
