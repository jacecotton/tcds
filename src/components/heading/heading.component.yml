name: Heading
status: stable
group: Text
props:
  type: object
  properties:
    text:
      type: string
      title: Text
      $ref: json-schema-definitions://canvas.module/textarea
      description: Enter heading text
    heading_level:
      type: string
      title: Heading level
      enum: ["h2", "h3", "h4", "h5", "h6"]
      meta:enum:
        h2: "Heading 2"
        h3: "Heading 3"
        h4: "Heading 4"
        h5: "Heading 5"
        h6: "Heading 6"
      default: h2
    classes:
      type: string
      title: Classes
