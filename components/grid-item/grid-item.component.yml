$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Grid item
description: Containers for grid items.
status: experimental
group: Layout
props:
  type: object
  properties:
    column_size:
      type: string
      title: Column size
      description: "Base column size (applies to all screens by default)."
      enum: ["1/1", "1/2", "1/3", "2/3", "1/4", "3/4"]
      meta:enum:
        "1/1": "1/1 (12 columns)"
        "1/2": "1/2 (6 columns)"
        "1/3": "1/3 (4 columns)"
        "2/3": "2/3 (8 columns)"
        "1/4": "1/4 (3 columns)"
        "3/4": "3/4 (9 columns)"
      examples: ["1/1"]
    column_size_sm:
      type: string
      title: "Column size @sm"
      description: "Column size above small screens (640px)."
      enum: ["inherit", "1/1", "1/2", "1/3", "2/3", "1/4", "3/4"]
      meta:enum:
        "inherit": "Inherit from default."
        "1/1": "1/1 (12 columns)"
        "1/2": "1/2 (6 columns)"
        "1/3": "1/3 (4 columns)"
        "2/3": "2/3 (8 columns)"
        "1/4": "1/4 (3 columns)"
        "3/4": "3/4 (9 columns)"
      examples: ["inherit"]
    column_size_md:
      type: string
      title: "Column size @md"
      description: "Column size above medium screens (960px)."
      enum: ["inherit", "1/1", "1/2", "1/3", "2/3", "1/4", "3/4"]
      meta:enum:
        "inherit": "Inherit from small."
        "1/1": "1/1 (12 columns)"
        "1/2": "1/2 (6 columns)"
        "1/3": "1/3 (4 columns)"
        "2/3": "2/3 (8 columns)"
        "1/4": "1/4 (3 columns)"
        "3/4": "3/4 (9 columns)"
      examples: ["inherit"]
    column_size_lg:
      type: string
      title: "Column size @lg"
      description: "Column size above large screens (1280px)."
      enum: ["inherit", "1/1", "1/2", "1/3", "2/3", "1/4", "3/4"]
      meta:enum:
        "inherit": "Inherit from medium."
        "1/1": "1/1 (12 columns)"
        "1/2": "1/2 (6 columns)"
        "1/3": "1/3 (4 columns)"
        "2/3": "2/3 (8 columns)"
        "1/4": "1/4 (3 columns)"
        "3/4": "3/4 (9 columns)"
      examples: ["inherit"]
    classes:
      type: string
      title: Classes
slots:
  content:
    title: Content
