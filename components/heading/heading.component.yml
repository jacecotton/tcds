name: Heading
status: stable
group: Text
props:
  type: object
  required: ["heading_level"]
  properties:
    text:
      type: string
      title: Text
      description: "Enter heading text."
      examples: ["My heading"]
      contentMediaType: text/html
      x-formatting-context: inline
    heading_level:
      type: string
      title: Heading level
      enum: ["h1", "h2", "h3", "h4", "h5", "h6"]
      examples: ["h2"]
      meta:enum:
        h1: "Heading 1"
        h2: "Heading 2"
        h3: "Heading 3"
        h4: "Heading 4"
        h5: "Heading 5"
        h6: "Heading 6"
    max_length:
      type: number
      title: Max characters per line
    classes:
      type: string
      title: Classes
