$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Image
description: Image
status: experimental
group: Content
props:
  type: object
  properties:
    image:
      type: object
      title: Image
      $ref: "json-schema-definitions://canvas.module/image"
    caption:
      type: string
      title: Caption (optional)
      contentMediaType: text/html
      x-formatting-context: inline
    fit:
      type: string
      title: Fit
      enum: ["contain", "cover"]
      meta:enum:
        contain: Contain
        cover: Cover
      default: "contain"
      examples: ["contain"]
    classes:
      type: string
      title: Custom classes
