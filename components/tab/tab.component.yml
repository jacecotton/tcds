$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Tab
description: Tab
status: experimental
group: Content
libraryOverrides:
  js:
    tab.js:
      attributes:
        type: module
      preprocess: false
thirdPartySettings:
  tcds:
    docs:
      parent: "tcds:tabs"
props:
  type: object
  required:
    - heading_level
  properties:
    selected:
      type: boolean
      title: Selected
      description: "Whether this is the initially selected tab. Defaults to the first tab if none are selected."
    heading_level:
      type: string
      title: Heading level
      description: "The semantic heading level to use within the page outline when collapsed into an accordion (does not change visual appearance). Defaults to h3."
      enum: ["h2", "h3", "h4", "h5", "h6"]
      meta:enum:
        h2: "Heading 2"
        h3: "Heading 3"
        h4: "Heading 4"
        h5: "Heading 5"
        h6: "Heading 6"
      examples: ["h3"]
    title:
      type: string
      title: Title
      description: "The label for the tab button."
slots:
  content:
    title: Content
